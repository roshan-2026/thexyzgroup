<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<meta name="description" content="This page is coming soon — we're working on it.">
<style>
  :root{
    --bg: #0b1220;
    --text: #eee9df;
    --muted: #9aa2b6;
    --accent: #c9a24b;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .wrap{ max-width: 480px; }
  .dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-right: 8px;
    animation: pulse 1.6s infinite;
  }
  .label{
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  h1{
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    margin: 0 0 12px;
    font-weight: 600;
  }
  p{
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 28px;
  }
  a.btn{
    display: inline-block;
    padding: 12px 24px;
    background: var(--accent);
    color: #17110a;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  a.btn:hover{ transform: translateY(-2px); opacity: 0.9; }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.3; }
  }
</style>
</head>
<body>
    <div class="wrap">
      <div class="label">
      <img src="assets/icons/favicon.svg" alt="" width="150" height="150" loading="eager"></div><br>
    <div class="label"><span class="dot"></span>Working on it</div>
    <h1>We'll be here soon.</h1>
    <p>This page isn't ready yet, but it's on the way. Check back shortly.</p>
    <a class="btn" href="mailto:roshan.nishad@thexyzgroup.in">Notify Me</a>
  </div>
</body>
</html>
